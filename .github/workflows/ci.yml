# CI — PRABHA 6.0 har push par Windows, Linux aur macOS teeno par test hota hai.
#  Linux/macOS: runtime + examples, protocol (fd 3), frame decode, PRABHA ka apna Zig
#               compiler asli download + SHA-256 + build-test
#  Windows:     MinGW build, stdout protocol + getch, console + crash codes
#  Sab par:     IDE (errors/tips/console/crash), build, Turbo → Modern (same output),
#               debugger (Linux/Windows gdb, macOS lldb-dap), extension wiring (mock VS Code)
name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        if: runner.os != 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        if: runner.os != 'Windows'
        run: python -m pip install --upgrade pip pillow

      - name: Make sure MinGW gcc is on PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command gcc -ErrorAction SilentlyContinue)) { choco install mingw -y --no-progress; "C:\ProgramData\mingw64\mingw64\bin" | Out-File -Append $env:GITHUB_PATH }
          gcc --version

      - name: PRABHA test suite (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        # Fail hone par aakhri 60 lines ek ::error annotation mein — taaki log bina
        # GitHub login ke Checks API se padha ja sake.
        run: |
          set -o pipefail
          if ! bash tests/run-all.sh 2>&1 | tee run-all.log; then
            tail -60 run-all.log | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' > tail.txt
            echo "::error title=run-all.sh failed::$(cat tail.txt)"
            exit 1
          fi

      - name: Windows runtime test (stdout protocol, getch, examples, console, crash codes)
        if: runner.os == 'Windows'
        run: node tests/ci.js windows-sim node tests/windows-sim.js

      - name: Install gdb (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gdb clang

      - name: IDE core (errors + Hinglish tips, console, crash text)
        run: node tests/ci.js ide-test node tests/ide-test.js

      - name: Build pipeline (Turbo mode, panel, debug build, strict)
        run: node tests/ci.js build-test node tests/build-test.js

      - name: Turbo → Modern converter (same output check)
        run: node tests/ci.js modern-test node tests/modern-test.js

      - name: Turbo → Modern + build with clang (Linux)
        if: runner.os == 'Linux'
        env:
          PRABHA_TEST_CC: clang
          PRABHA_TEST_CXX: clang++
        run: node tests/ci.js ide-clang node tests/ide-test.js && node tests/ci.js build-clang node tests/build-test.js && node tests/ci.js modern-clang node tests/modern-test.js

      - name: Debugger (gdb on Linux/Windows, lldb-dap on macOS)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then node tests/ci.js debug-lldb node tests/debug-test.js lldb; else node tests/ci.js debug-gdb node tests/debug-test.js gdb; fi

      - name: PRABHA's own compiler — real Zig download + verify + build (Linux/macOS)
        if: runner.os != 'Windows'
        run: node tests/ci.js zig-install node tests/zig-install-test.js

      - name: Router + toolchain + extension wiring
        run: node tests/ci.js extension-test node tests/extension-test.js

      - name: PRABHA's own compiler on Windows — real WinLibs GCC + gdb download, verify, build, debug
        if: runner.os == 'Windows'
        run: node tests/ci.js winlibs-install node tests/winlibs-install-test.js

      - name: Default mode (6.0) — first Run auto-installs PRABHA's compiler, then uses it
        env:
          PRABHA_TEST_TOOLCHAIN_MODE: bundled
        run: node tests/ci.js extension-bundled node tests/extension-test.js

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          for f in extension.js lib/*.js lib/*/*.js media/*.js tests/*.js; do node --check "$f"; done

      - name: Package .vsix
        if: runner.os == 'Linux'
        run: npx --yes @vscode/vsce@3 package -o prabha.vsix

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: prabha-vsix
          path: prabha.vsix
