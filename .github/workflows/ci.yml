name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow

      - name: Run PRABHA test suite
        shell: bash
        run: |
          bash tests/run-all.sh

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          node --check extension.js
          find . -maxdepth 2 -type f -name '*.js' -not -path './node_modules/*' -print0 |
            xargs -0 -r -n1 node --check
