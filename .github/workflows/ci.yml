# CI — PRABHA har push par Windows, Linux aur macOS teeno par test hota hai.
#  Linux/macOS: runtime + saare examples compile, protocol (fd 3) integration, frame decode
#  Windows:     runtime + examples MinGW se compile, stdout protocol + getch (Enter/arrow) test
#  Sab par:     toolchain detect, stdout router, extension wiring (mock VS Code)
name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        if: runner.os != 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        if: runner.os != 'Windows'
        run: python -m pip install --upgrade pip pillow

      - name: Make sure MinGW gcc is on PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command gcc -ErrorAction SilentlyContinue)) { choco install mingw -y --no-progress; "C:\ProgramData\mingw64\mingw64\bin" | Out-File -Append $env:GITHUB_PATH }
          gcc --version

      - name: PRABHA test suite (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: bash tests/run-all.sh

      - name: Windows runtime test (stdout protocol, getch, examples)
        if: runner.os == 'Windows'
        run: node tests/windows-sim.js

      - name: Router + toolchain + extension wiring
        run: node tests/extension-test.js

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          for f in extension.js lib/*.js tests/*.js; do node --check "$f"; done

      - name: Package .vsix
        if: runner.os == 'Linux'
        run: npx --yes @vscode/vsce@3 package -o prabha.vsix

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: prabha-vsix
          path: prabha.vsix
